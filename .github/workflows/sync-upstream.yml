name: Sync and curate upstream templates

# This repository is the versioned home of the pipeline: tools/normalize.py, its test in
# tests/, the brand assets in brand/ and this workflow. The private QianDao repository
# used to keep a nested copy and no longer does, so edits belong here first.
#
# The job keeps our public template repository in step with the upstream community one
# and lays it out the way we publish it: templates/<category>/<file>.har with a
# regenerated tpls_history.json whose filenames carry the category path. It pushes back
# to itself with the built-in GITHUB_TOKEN, so no personal access token is involved.
#
# The normaliser's test suite runs before anything is fetched, so a broken script stops
# the sync instead of publishing a mangled index.
#
# Only templates/, tpls_history.json, README.md and CATEGORIES.md are replaced; brand/
# and tools/ are left alone.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: python -m pip install --quiet pytest

      - name: Verify the normaliser before publishing
        run: python -B -m pytest tests -q

      - name: Fetch upstream
        run: |
          rm -rf upstream
          git clone --depth 1 https://github.com/qd-today/templates.git upstream

      - name: Curate into the published layout
        run: |
          rm -rf curated
          python tools/normalize.py upstream curated

      - name: Copy the curated tree over this repository
        run: |
          rm -rf templates
          cp -r curated/templates templates
          cp curated/tpls_history.json tpls_history.json
          cp curated/README.md README.md
          cp curated/CATEGORIES.md CATEGORIES.md
          rm -rf curated upstream

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: sync upstream templates ($(date -u +%Y-%m-%d))"
            git push origin master
          else
            echo "No template changes"
          fi
