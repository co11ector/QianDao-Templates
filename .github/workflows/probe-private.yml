name: Probe private checkout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try private checkout with the repository token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: co11ector/QianDao
          ref: main
          path: private-src
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Report
        run: |
          if [ -d private-src/run.py ]; then
            echo "RESULT=CHECKOUT_OK"
            head -3 private-src/run.py
          else
            echo "RESULT=CHECKOUT_FAILED"
          fi
